description: "1up search cold-start evaluation: bounded readiness waiting (oneup_status/oneup_start) on an unindexed workspace"

evaluateOptions:
  maxConcurrency: 1

prompts:
  - id: file://prompt-1up.txt
    label: 1up

providers:
  - id: openai:codex-sdk
    label: 1up-agent
    prompts: [1up]
    config:
      model: gpt-5.6-luna
      working_dir: "{{WORKSPACE_DIR}}"
      sandbox_mode: workspace-write
      approval_policy: never
      network_access_enabled: false
      web_search_mode: disabled
      enable_streaming: true
      cli_env:
        HOME: "{{_HOME}}"
        CODEX_HOME: "{{_CODEX_HOME}}"
        PATH: "{{_PATH}}"
        NODE_EXTRA_CA_CERTS: "{{_NODE_EXTRA_CA_CERTS}}"
      cli_config:
        features:
          apps: false
          non_prefixed_mcp_tool_names: true
          plugins: false
        mcp_servers:
          oneup:
            command: 1up
            args: ["mcp", "--path", "{{WORKSPACE_DIR}}"]
            required: true
            startup_timeout_sec: 30

defaultTest:
  vars:
    FIXTURE_MODE: cold
  options:
    provider:
      id: openai:codex-sdk:gpt-5.6-luna
      config:
        sandbox_mode: read-only
        approval_policy: never
        network_access_enabled: false
        web_search_mode: disabled
        cli_env:
          HOME: "{{_HOME}}"
          CODEX_HOME: "{{_CODEX_HOME}}"
          PATH: "{{_PATH}}"
          NODE_EXTRA_CA_CERTS: "{{_NODE_EXTRA_CA_CERTS}}"

extensions:
  - file://../shared/extension.ts:default

tests:
  - description: Cold Start Search Stack
    vars:
      TASK_PROMPT: >
        Trace how emdash content search is enabled and queried, from a field
        becoming searchable through to admin search results. Identify the key
        files involved in each step. Follow the admin global/full-text search
        results surface, not the collection content list's local client-side
        filter.
      EXPECTED_FILES: fts-manager.ts,query.ts,AdminCommandPalette.tsx
    assert:
      - type: javascript
        value: |
          const expected = String(context.vars.EXPECTED_FILES).split(',').map(f => f.trim());
          const missing = expected.filter(f => !output.includes(f.split('/').pop() || f));
          const found = expected.length - missing.length;
          const score = found / expected.length;
          return { pass: true, score, reason: missing.length === 0 ? `Referenced all expected files: ${expected.join(', ')}` : `Found ${found}/${expected.length}. Missing: ${missing.join(', ')}` };
      - type: javascript
        value: file://../shared/assertions/index.ts:assert1upUsed
      - type: javascript
        value: file://../shared/assertions/index.ts:assertReadinessWorkflowUsed
      - type: javascript
        value: file://../shared/assertions/index.ts:assertReadAfterSearch
      - type: javascript
        value: file://../shared/assertions/index.ts:assertSymbolVerificationUsed
      - type: javascript
        value: file://../shared/assertions/index.ts:assertNoFallbackTools
      - type: javascript
        value: file://../shared/assertions/index.ts:assertValidOneupMcpCalls
      - type: javascript
        value: file://../shared/assertions/index.ts:assertStructuredOneupMcpResponses
      - type: javascript
        value: file://../shared/assertions/index.ts:reportEfficiency
      - type: llm-rubric
        value: >
          Accuracy: The correct search flow in emdash is: (1) FTSManager in
          fts-manager.ts creates FTS5 virtual tables and triggers, (2) query.ts
          runs FTS5 MATCH queries via searchSingleCollection(), (3)
          AdminCommandPalette.tsx is the admin search UI. Score 1.0 if the
          answer correctly names these key files and their roles. Score 0.5
          if some are correct but others wrong or missing. Score 0.0 if
          fundamentally wrong. Judge only factual correctness, not format
          or length.
      - type: llm-rubric
        value: >
          Completeness: The answer should cover these stages: (a) fields
          marked searchable, (b) FTS indexing, (c) query execution, (d)
          admin UI. Score 1.0 if all four stages are mentioned, 0.75 if
          three, 0.5 if two, 0.25 if one. Judge only coverage, not format
          or length.
