description: "1up search evaluation: Codex SDK/Luna 1up vs baseline comparison"

evaluateOptions:
  maxConcurrency: 1

prompts:
  - id: file://prompt-1up-warm.txt
    label: 1up
  - id: file://prompt-baseline.txt
    label: baseline

providers:
  - id: openai:codex-sdk
    label: 1up-agent
    prompts: [1up]
    config:
      model: gpt-5.6-luna
      working_dir: "{{WORKSPACE_DIR}}"
      sandbox_mode: workspace-write
      approval_policy: never
      network_access_enabled: false
      web_search_mode: disabled
      enable_streaming: true
      cli_env:
        HOME: "{{_HOME}}"
        CODEX_HOME: "{{_CODEX_HOME}}"
        PATH: "{{_PATH}}"
        NODE_EXTRA_CA_CERTS: "{{_NODE_EXTRA_CA_CERTS}}"
      cli_config:
        suppress_unstable_features_warning: true
        features:
          apps: false
          non_prefixed_mcp_tool_names: true
          plugins: false
        mcp_servers:
          oneup:
            command: 1up
            args: ["mcp", "--path", "{{WORKSPACE_DIR}}"]
            required: true
            startup_timeout_sec: 30

  - id: openai:codex-sdk
    label: baseline-agent
    prompts: [baseline]
    config:
      model: gpt-5.6-luna
      working_dir: "{{WORKSPACE_DIR}}"
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_mode: disabled
      enable_streaming: true
      cli_env:
        HOME: "{{_HOME}}"
        CODEX_HOME: "{{_CODEX_HOME}}"
        PATH: "{{_PATH}}"
        NODE_EXTRA_CA_CERTS: "{{_NODE_EXTRA_CA_CERTS}}"

defaultTest:
  options:
    provider:
      id: openai:codex-sdk:gpt-5.6-luna
      config:
        sandbox_mode: read-only
        approval_policy: never
        network_access_enabled: false
        web_search_mode: disabled
        cli_env:
          HOME: "{{_HOME}}"
          CODEX_HOME: "{{_CODEX_HOME}}"
          PATH: "{{_PATH}}"
          NODE_EXTRA_CA_CERTS: "{{_NODE_EXTRA_CA_CERTS}}"

extensions:
  - file://../shared/extension.ts:default

tests:
  - description: Search Stack
    vars:
      TASK_PROMPT: >
        Trace how emdash content search is enabled and queried, from a field
        becoming searchable through to admin search results. Identify the key
        files involved in each step. Follow the admin global/full-text search
        results surface, not the collection content list's local client-side
        filter.
      EXPECTED_FILES: fts-manager.ts,query.ts,AdminCommandPalette.tsx
    assert:
      - type: javascript
        metric: retrieval
        value: |
          const expected = String(context.vars.EXPECTED_FILES).split(',').map(f => f.trim());
          const missing = expected.filter(f => !output.includes(f.split('/').pop() || f));
          const found = expected.length - missing.length;
          const score = found / expected.length;
          return { pass: true, score, reason: missing.length === 0 ? `Referenced all expected files: ${expected.join(', ')}` : `Found ${found}/${expected.length}. Missing: ${missing.join(', ')}` };
      - type: javascript
        value: file://../shared/assertions/index.ts:assert1upUsed
        metric: adoption
      - type: javascript
        value: file://../shared/assertions/index.ts:assertWarmReadiness
        metric: adoption
      - type: javascript
        value: file://../shared/assertions/index.ts:assertReadAfterSearch
        metric: adoption
      - type: javascript
        value: file://../shared/assertions/index.ts:assertSymbolVerificationUsed
        metric: adoption
      - type: javascript
        value: file://../shared/assertions/index.ts:assertNoFallbackTools
        metric: adoption
      - type: javascript
        value: file://../shared/assertions/index.ts:assertValidOneupMcpCalls
        metric: reliability
      - type: javascript
        value: file://../shared/assertions/index.ts:assertStructuredOneupMcpResponses
        metric: reliability
      - type: javascript
        value: file://../shared/assertions/index.ts:reportRunMetrics
        metric: efficiency
      - type: llm-rubric
        metric: factual
        value: >
          Accuracy: The correct search flow in emdash is: (1) FTSManager in
          fts-manager.ts creates FTS5 virtual tables and triggers, (2) query.ts
          runs FTS5 MATCH queries via searchSingleCollection(), (3)
          AdminCommandPalette.tsx is the admin search UI. Score 1.0 if the
          answer correctly names these key files and their roles. Score 0.5
          if some are correct but others wrong or missing. Score 0.0 if
          fundamentally wrong. Judge only factual correctness, not format
          or length.
      - type: llm-rubric
        metric: factual
        value: >
          Completeness: The answer should cover these stages: (a) fields
          marked searchable, (b) FTS indexing, (c) query execution, (d)
          admin UI. Score 1.0 if all four stages are mentioned, 0.75 if
          three, 0.5 if two, 0.25 if one. Judge only coverage, not format
          or length.

  - description: WordPress Import
    vars:
      TASK_PROMPT: >
        Explain the WordPress import pipeline from the admin wizard through
        schema preparation, WXR execution, and Gutenberg-to-Portable-Text
        conversion. Identify the key files involved in each step.
      EXPECTED_FILES: WordPressImport.tsx,prepare.ts,execute.ts,gutenberg-to-portable-text/src/index.ts
    assert:
      - type: javascript
        metric: retrieval
        value: |
          const expected = String(context.vars.EXPECTED_FILES).split(',').map(f => f.trim());
          const missing = expected.filter(f => !output.includes(f.split('/').pop() || f));
          const found = expected.length - missing.length;
          const score = found / expected.length;
          return { pass: true, score, reason: missing.length === 0 ? `Referenced all expected files: ${expected.join(', ')}` : `Found ${found}/${expected.length}. Missing: ${missing.join(', ')}` };
      - type: javascript
        value: file://../shared/assertions/index.ts:assert1upUsed
        metric: adoption
      - type: javascript
        value: file://../shared/assertions/index.ts:assertWarmReadiness
        metric: adoption
      - type: javascript
        value: file://../shared/assertions/index.ts:assertReadAfterSearch
        metric: adoption
      - type: javascript
        value: file://../shared/assertions/index.ts:assertSymbolVerificationUsed
        metric: adoption
      - type: javascript
        value: file://../shared/assertions/index.ts:assertNoFallbackTools
        metric: adoption
      - type: javascript
        value: file://../shared/assertions/index.ts:assertValidOneupMcpCalls
        metric: reliability
      - type: javascript
        value: file://../shared/assertions/index.ts:assertStructuredOneupMcpResponses
        metric: reliability
      - type: javascript
        value: file://../shared/assertions/index.ts:reportRunMetrics
        metric: efficiency
      - type: llm-rubric
        metric: factual
        value: >
          Accuracy: The correct WordPress import flow is: (1) WordPressImport.tsx
          is the admin wizard UI, (2) prepare.ts handles schema preparation
          creating collections and fields, (3) execute.ts parses WXR and
          imports content, (4) gutenberg-to-portable-text/src/index.ts converts
          Gutenberg blocks to Portable Text. Score 1.0 if all four are correctly
          described, 0.5 if partially correct, 0.0 if fundamentally wrong.
          Judge only factual correctness, not format or length.
      - type: llm-rubric
        metric: factual
        value: >
          Completeness: The answer should cover: (a) admin wizard UI,
          (b) schema preparation, (c) WXR parsing/execution, (d) content
          format conversion. Score 1.0 if all four, 0.75 if three, 0.5 if
          two, 0.25 if one. Judge only coverage, not format or length.

  - description: Plugin Architecture
    vars:
      TASK_PROMPT: >
        Compare emdash's trusted in-process plugin registration and hook
        execution with its separate sandboxed-plugin path. Trace how sandbox
        descriptors become runtime manifests, how plugin code is loaded into
        Cloudflare Worker isolation, and how controlled content, storage, and
        network access is enforced. Identify the key files involved and do not
        treat trusted hook registration as sandbox registration.
      EXPECTED_FILES: manager.ts,hooks.ts,emdash-runtime.ts,runner.ts,wrapper.ts,bridge.ts
    assert:
      - type: javascript
        metric: retrieval
        value: |
          const expected = String(context.vars.EXPECTED_FILES).split(',').map(f => f.trim());
          const missing = expected.filter(f => !output.includes(f.split('/').pop() || f));
          const found = expected.length - missing.length;
          const score = found / expected.length;
          return { pass: true, score, reason: missing.length === 0 ? `Referenced all expected files: ${expected.join(', ')}` : `Found ${found}/${expected.length}. Missing: ${missing.join(', ')}` };
      - type: javascript
        value: file://../shared/assertions/index.ts:assert1upUsed
        metric: adoption
      - type: javascript
        value: file://../shared/assertions/index.ts:assertWarmReadiness
        metric: adoption
      - type: javascript
        value: file://../shared/assertions/index.ts:assertReadAfterSearch
        metric: adoption
      - type: javascript
        value: file://../shared/assertions/index.ts:assertSymbolVerificationUsed
        metric: adoption
      - type: javascript
        value: file://../shared/assertions/index.ts:assertNoFallbackTools
        metric: adoption
      - type: javascript
        value: file://../shared/assertions/index.ts:assertValidOneupMcpCalls
        metric: reliability
      - type: javascript
        value: file://../shared/assertions/index.ts:assertStructuredOneupMcpResponses
        metric: reliability
      - type: javascript
        value: file://../shared/assertions/index.ts:reportRunMetrics
        metric: efficiency
      - type: llm-rubric
        metric: factual
        value: >
          Accuracy: EmDash has two distinct paths. For trusted in-process
          plugins, manager.ts registers PluginDefinition objects and hooks.ts
          builds and executes the hook pipeline with PluginContext capability
          checks. Sandboxed descriptors are handled separately: emdash-runtime.ts
          creates PluginManifest values and asks SandboxRunner to load them;
          Cloudflare runner.ts creates Worker Loader isolates, wrapper.ts exposes
          hook and route RPC inside the isolate, and bridge.ts enforces declared
          capabilities, storage scope, and allowed network hosts. Score 1.0 if
          the answer preserves this distinction and correctly describes the
          sandbox boundary and controls, 0.5 if partially correct, 0.0 if it
          conflates trusted registration with sandbox loading or is fundamentally
          wrong. Judge only factual correctness, not format or length.
      - type: llm-rubric
        metric: factual
        value: >
          Completeness: The answer should cover: (a) trusted in-process
          registration and hook execution, (b) separate sandbox descriptor and
          runtime loading, (c) Worker isolation and wrapper RPC, (d) controlled
          content, storage, and network access. Score 1.0 if all four, 0.75 if
          three, 0.5 if two, 0.25 if one. Judge only coverage, not format or
          length.

  - description: Live Content Query
    vars:
      TASK_PROMPT: >
        Trace emdash's public Astro live-collection path: from database-backed
        schema persistence, through the site's live collection configuration
        and the emdash live loader, to the typed public collection and entry
        query helpers used by Astro pages. Identify the key files involved in
        each step. Distinguish this public path from internal admin/runtime
        queries made directly through the content repository.
      EXPECTED_FILES: registry.ts,loader.ts,query.ts,live.config.ts
    assert:
      - type: javascript
        metric: retrieval
        value: |
          const expected = String(context.vars.EXPECTED_FILES).split(',').map(f => f.trim());
          const missing = expected.filter(f => !output.includes(f.split('/').pop() || f));
          const found = expected.length - missing.length;
          const score = found / expected.length;
          return { pass: true, score, reason: missing.length === 0 ? `Referenced all expected files: ${expected.join(', ')}` : `Found ${found}/${expected.length}. Missing: ${missing.join(', ')}` };
      - type: javascript
        value: file://../shared/assertions/index.ts:assert1upUsed
        metric: adoption
      - type: javascript
        value: file://../shared/assertions/index.ts:assertWarmReadiness
        metric: adoption
      - type: javascript
        value: file://../shared/assertions/index.ts:assertReadAfterSearch
        metric: adoption
      - type: javascript
        value: file://../shared/assertions/index.ts:assertSymbolVerificationUsed
        metric: adoption
      - type: javascript
        value: file://../shared/assertions/index.ts:assertNoFallbackTools
        metric: adoption
      - type: javascript
        value: file://../shared/assertions/index.ts:assertValidOneupMcpCalls
        metric: reliability
      - type: javascript
        value: file://../shared/assertions/index.ts:assertStructuredOneupMcpResponses
        metric: reliability
      - type: javascript
        value: file://../shared/assertions/index.ts:reportRunMetrics
        metric: efficiency
      - type: llm-rubric
        metric: factual
        value: >
          Accuracy: SchemaRegistry in registry.ts persists collection and field
          metadata and maintains the dynamic content tables. A site's
          live.config.ts registers the generic _emdash Astro live collection
          with emdashLoader(). The LiveLoader in loader.ts translates collection
          and entry requests into queries against the appropriate dynamic table.
          The public getEmDashCollection() and getEmDashEntry() helpers in
          query.ts call Astro's live-content APIs and preserve generated
          collection types. ContentRepository.findMany is an internal
          repository query, not this public Astro live-collection path. Score
          1.0 if all roles and the distinction are correct, 0.5 if partially
          correct, 0.0 if fundamentally wrong. Judge only factual correctness,
          not format or length.
      - type: llm-rubric
        metric: factual
        value: >
          Completeness: The answer should cover: (a) database-backed schema and
          dynamic tables, (b) live.config.ts registration with emdashLoader(),
          (c) loader.ts query translation, (d) typed public helpers in query.ts.
          Score 1.0 if all four, 0.75 if three, 0.5 if two, 0.25 if one. Judge
          only coverage, not format or length.
