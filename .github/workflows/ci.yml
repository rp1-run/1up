name: ci

on:
  pull_request:
  push:
    branches:
      - main
    # A release pushes a manifest-only "chore: publish update manifest" commit
    # immediately after the release commit. Without this ignore it triggers ci
    # and, via the cancel-in-progress concurrency below, cancels the release
    # commit's still-running ci run (observed on v0.1.12). The published manifest
    # is validated by publish-update-manifest.yml's own verify job, so a
    # manifest-only push to main does not need its own ci run.
    paths-ignore:
      - update-manifest.json

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-check:
    name: security-check
    runs-on: ubuntu-24.04
    env:
      # The gate runs the full test suite, which spawns real `1up`
      # processes. Runners have no embedding model, so without this kill
      # switch those processes attempt live model downloads and global model
      # state can flip mid-suite — a recurring source of intermittent
      # failures in this job. Keep the suite deterministic: FTS-only.
      ONEUP_DISABLE_MODEL_DOWNLOADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cache rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-security-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-security-

      - name: cache cargo-audit binary
        id: cache-cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        shell: bash
        run: cargo install --locked cargo-audit

      - name: run security gate
        shell: bash
        run: bash scripts/security_check.sh

      - name: retain security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-check
          path: target/security/security-check.json
          if-no-files-found: error
          retention-days: 30

  release-smoke-macos:
    name: release-smoke-macos
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cache rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-release-

      - name: build release binary
        shell: bash
        run: cargo build --locked --release --bin 1up

  release-smoke-linux:
    name: release-smoke-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cache rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-release-

      - name: build release binary
        shell: bash
        run: cargo build --locked --release --bin 1up

  release-smoke-windows:
    name: release-smoke-windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cache rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-release-

      - name: build release binary
        shell: bash
        run: cargo build --locked --release --bin 1up

  windows-functional:
    # Functional smoke for Windows path handling (issue #54). Builds a dev
    # profile binary (no LTO release build), runs the shared::fs and
    # shared::project unit suites that cover extended-length (\\?\C:\...)
    # paths, then indexes a real temp directory and asserts project init,
    # indexing, and JSON status succeed end to end.
    name: windows-functional
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cache rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-dev-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-dev-

      - name: build dev binary
        shell: bash
        run: cargo build --locked --bin 1up

      - name: unit tests for windows path handling
        shell: bash
        run: 'cargo test --locked --lib -- shared::fs:: shared::project::'

      - name: functional index and status smoke
        shell: bash
        run: |
          # Force FTS-only indexing: this smoke verifies path and project
          # semantics, and the embedding path (model download + dynamic ORT
          # loading without a staged DLL) hangs dev builds on windows runners.
          for base in "$APPDATA" "$LOCALAPPDATA"; do
            [ -n "$base" ] || continue
            marker_dir="$base/1up/models/all-MiniLM-L6-v2"
            mkdir -p "$marker_dir"
            printf 'ci-fts-only' > "$marker_dir/.download_failed"
          done

          smoke_dir=$(mktemp -d)
          mkdir -p "$smoke_dir/.git" "$smoke_dir/src"
          printf 'pub fn windows_smoke_marker() -> u32 {\n    42\n}\n' \
            > "$smoke_dir/src/lib.rs"

          ./target/debug/1up index "$smoke_dir" --format json

          status_json=$(./target/debug/1up status "$smoke_dir" --format json)
          printf '%s\n' "$status_json"
          # `1up index` does not write a project id (init/start/MCP lifecycle
          # owns that), so assert the index/read-back guarantees instead;
          # verified identical on macOS.
          jq -e '.last_update_state == "complete"
            and (.indexed_files // 0) >= 1
            and (.total_segments // 0) >= 1' \
            <<<"$status_json"

  release-consistency:
    name: release-consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: validate release metadata surfaces
        shell: bash
        run: |
          version=$(awk -F'"' '
            /^\[package\]$/ { in_package = 1; next }
            /^\[/ && in_package { exit }
            in_package && /^version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)
          bash scripts/release/validate_release_metadata.sh "v${version}"

  setup-script-lint:
    # Shell-only lint gates for scripts/install/setup.sh. Runs fast, with no
    # Rust toolchain needed. Bash 3.2 compatibility is covered by a pinned
    # container parse check; shellcheck runs natively on the Ubuntu runner.
    name: setup-script-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        shell: bash
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --severity=style scripts/install/setup.sh

      - name: bash 3.2 compat smoke
        shell: bash
        run: |
          # Parse setup.sh under a pinned bash 3.2 image so macOS system bash
          # stays in the supported matrix. `bash -n` gives us a hard syntax
          # gate without needing network access at run time.
          docker run --rm \
            -v "$PWD:/s:ro" \
            bash:3.2 \
            bash -n /s/scripts/install/setup.sh

  setup-script-integration:
    # Black-box integration tests for scripts/install/setup.sh. The Linux
    # leg runs the suite under bash 5.x; the macOS leg runs the same suite
    # under macOS system bash, which is the canonical bash 3.2.x runtime
    # the script must support. Together they turn the parse-only bash 3.2
    # gate into a real fixture-backed runtime check.
    name: setup-script-integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cache rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-setup-script-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-setup-script-

      - name: record bash version
        shell: bash
        run: bash --version

      - name: setup_script_tests
        shell: bash
        run: cargo test --locked --test setup_script_tests
