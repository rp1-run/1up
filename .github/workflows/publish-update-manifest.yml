name: publish-update-manifest

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish update-manifest.json for
        required: true
        type: string

permissions:
  contents: write

env:
  UPDATE_MANIFEST_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/update-manifest.json
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

jobs:
  publish-update-manifest:
    name: publish update manifest to main
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PAT }}
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
    steps:
      - name: validate release pat
        shell: bash
        run: |
          if [[ -z "${RELEASE_PAT:-}" ]]; then
            echo "RELEASE_PAT is required to publish update-manifest.json to main" >&2
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          token: ${{ secrets.RELEASE_PAT }}

      - name: download attested update manifest asset
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/release"

          for attempt in $(seq 1 60); do
            rm -f "${RUNNER_TEMP}/release/update-manifest.json"
            if gh release download "${RELEASE_TAG}" \
              --pattern update-manifest.json \
              --dir "${RUNNER_TEMP}/release" \
              --clobber >/dev/null 2>&1; then
              break
            fi

            echo "waiting for update-manifest.json for ${RELEASE_TAG} (attempt ${attempt}/60)" >&2
            sleep 20
          done

          test -f "${RUNNER_TEMP}/release/update-manifest.json"

      - name: publish attested update manifest verbatim
        shell: bash
        run: |
          # No regeneration here: release-assets.yml already attested this
          # exact byte stream as a build subject. Propagating it verbatim (not
          # re-projecting via jq) is what makes the committed main copy hash to
          # the attested digest.
          cp "${RUNNER_TEMP}/release/update-manifest.json" update-manifest.json

      - name: commit and push update manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update-manifest.json
          if git diff --cached --quiet; then
            echo "update-manifest.json is unchanged, skipping commit" >&2
            exit 0
          fi
          version=$(jq -r '.version' update-manifest.json)
          git commit -m "chore: publish update manifest for v${version}"
          git push origin HEAD:main

  verify-update-manifest:
    name: verify stable update manifest
    runs-on: ubuntu-24.04
    needs: publish-update-manifest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: download attested update manifest asset
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/release"
          gh release download "${RELEASE_TAG}" \
            --pattern update-manifest.json \
            --dir "${RUNNER_TEMP}/release"

      - name: wait for stable update manifest
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location "${UPDATE_MANIFEST_URL}" \
              --output "${RUNNER_TEMP}/update-manifest.json"; then
              break
            fi
            rm -f "${RUNNER_TEMP}/update-manifest.json"
            echo "waiting for ${UPDATE_MANIFEST_URL} (attempt ${attempt}/30)" >&2
            sleep 10
          done
          test -f "${RUNNER_TEMP}/update-manifest.json"

      - name: verify raw-fetched manifest is byte-identical to the attested release asset
        shell: bash
        run: |
          # Byte-compare (not a semantic/normalized diff): the release asset is
          # the attested build subject, so the copy on main must hash to the
          # exact same digest, not merely represent equivalent JSON.
          expected_sha256=$(sha256sum "${RUNNER_TEMP}/release/update-manifest.json" | awk '{print $1}')
          actual_sha256=$(sha256sum "${RUNNER_TEMP}/update-manifest.json" | awk '{print $1}')
          if [[ "$expected_sha256" != "$actual_sha256" ]]; then
            echo "update-manifest.json on main (sha256 ${actual_sha256}) does not byte-match the attested release asset (sha256 ${expected_sha256})" >&2
            diff -u "${RUNNER_TEMP}/release/update-manifest.json" "${RUNNER_TEMP}/update-manifest.json" || true
            exit 1
          fi
          echo "update-manifest.json on main matches the attested release asset (sha256 ${actual_sha256})"
